[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "local-caption"
version = "0.2.1"
description = "Offline desktop captions without auto_subtitle"
requires-python = ">=3.12,<3.14"
dependencies = ["PySide6==6.10.2"]

[project.optional-dependencies]
transcribe = ["openai-whisper==20250625", "torch==2.10.0"]
build = ["pyinstaller==6.19.0"]

[project.gui-scripts]
local-caption = "local_caption.app:main"

[tool.setuptools.packages.find]
include = ["local_caption*"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
